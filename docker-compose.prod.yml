services:
  mongodb:
    image: mongo:7
    container_name: airbnb-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    networks:
      - internal

  server:
    image: ${SERVER_IMAGE:-ghcr.io/youssef548/airbnb-server:latest}
    container_name: airbnb-server
    restart: unless-stopped
    depends_on:
      - mongodb
    volumes:
      - uploads:/app/packages/server/uploads
    environment:
      DATABASE_URL: mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/airbnb?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: 3000
      ALLOWED_ORIGINS: '["https://yfawzy.dev"]'
      CLIENT_URL: https://yfawzy.dev/projects/airbnb
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: https://yfawzy.dev/api/auth/google/callback
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: https://yfawzy.dev/api/auth/github/callback
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

  client:
    image: ${CLIENT_IMAGE:-ghcr.io/youssef548/airbnb-client:latest}
    container_name: airbnb-client
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - internal
      - gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.airbnb.rule=Host(`yfawzy.dev`) && PathPrefix(`/projects/airbnb`)"
      - "traefik.http.routers.airbnb.entrypoints=websecure"
      - "traefik.http.routers.airbnb.tls.certresolver=letsencrypt"
      - "traefik.http.routers.airbnb.middlewares=airbnb-strip@docker,secure-default@file"
      - "traefik.http.middlewares.airbnb-strip.stripprefix.prefixes=/projects/airbnb"
      - "traefik.http.services.airbnb.loadbalancer.server.port=80"
      - "traefik.docker.network=gateway"

networks:
  internal:
  gateway:
    external: true

volumes:
  mongodb_data:
  uploads:
