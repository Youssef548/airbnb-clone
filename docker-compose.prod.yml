services:
  mongodb:
    image: mongo:7
    container_name: airbnb-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    networks:
      - internal

  server:
    image: ${SERVER_IMAGE:-ghcr.io/abdulkhalek-1/airbnb-server:latest}
    container_name: airbnb-server
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      DATABASE_URL: mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/airbnb?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: 3000
      ALLOWED_ORIGINS: '["http://${SERVER_IP}"]'
      CLIENT_URL: http://${SERVER_IP}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: http://${SERVER_IP}/api/auth/google/callback
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: http://${SERVER_IP}/api/auth/github/callback
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

  client:
    image: ${CLIENT_IMAGE:-ghcr.io/abdulkhalek-1/airbnb-client:latest}
    container_name: airbnb-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
    networks:
      - internal

networks:
  internal:

volumes:
  mongodb_data:
