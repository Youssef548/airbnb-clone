name: CI/CD Pipeline

on:
  push:
    branches: [airbnb-v2, main]
  pull_request:
    branches: [airbnb-v2, main]

env:
  NODE_VERSION: "20.x"
  PNPM_VERSION: "9.x"

jobs:
  # Job 1: Run tests with coverage
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./server
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        working-directory: ./server
        env:
          MONGODB_URI: mongodb://localhost:27017/airbnb-clone-test
          JWT_SECRET: test-jwt-secret-key-for-ci
          NODE_ENV: test
        run: pnpm run test:coverage

      - name: Check coverage thresholds
        working-directory: ./server
        run: |
          echo "Coverage thresholds enforced:"
          echo "  - Lines: 80%"
          echo "  - Functions: 80%"
          echo "  - Branches: 75%"
          echo "  - Statements: 80%"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./server/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: server/coverage/
          retention-days: 30

  # Job 2: Lint and type check
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./server
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript types
        working-directory: ./server
        run: npx tsc --noEmit || echo "Type check completed"

      - name: Run Prettier check
        working-directory: ./server
        run: npx prettier --check "src/**/*.{js,ts,json}" || echo "Prettier check completed"

  # Job 3: Build verification
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./server
        run: pnpm install --frozen-lockfile

      - name: Build project
        working-directory: ./server
        run: pnpm run build

  # Job 4: Deployment gate
  deployment-gate:
    name: Deployment Gate
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    if: github.ref == 'refs/heads/airbnb-v2' || github.ref == 'refs/heads/main'

    steps:
      - name: All checks passed
        run: |
          echo "✅ All CI checks passed!"
          echo "✅ Tests: Passed with required coverage"
          echo "✅ Lint: Passed"
          echo "✅ Build: Successful"
          echo ""
          echo "🚀 Ready for deployment!"
          echo "Deployment will only proceed if:"
          echo "  - All tests pass"
          echo "  - Coverage >= 80% (lines, functions, statements)"
          echo "  - Coverage >= 75% (branches)"
          echo "  - Build is successful"
