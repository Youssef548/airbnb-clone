name: Build & Deploy

on:
  push:
    branches: [airbnb-v2]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/airbnb-server
  CLIENT_IMAGE: ghcr.io/${{ github.repository_owner }}/airbnb-client
  DEPLOY_PATH: /opt/airbnb-clone

jobs:
  build-server:
    name: Build Server Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Generate image tag
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/server/Dockerfile
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.SERVER_IMAGE }}:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  build-client:
    name: Build Client Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Generate image tag
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/client/Dockerfile.prod
          push: true
          tags: |
            ${{ env.CLIENT_IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.CLIENT_IMAGE }}:latest
          build-args: |
            VITE_BACKEND_URL=/api/
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  deploy:
    name: Deploy to Server
    needs: [build-server, build-client]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}

            # Pull latest compose config
            git fetch origin airbnb-v2
            git reset --hard origin/airbnb-v2

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true

            # Pull latest images
            docker pull ${{ env.SERVER_IMAGE }}:latest
            docker pull ${{ env.CLIENT_IMAGE }}:latest

            # Restart services
            docker compose -f docker-compose.prod.yml up -d

            # Verify containers are running
            sleep 5
            docker compose -f docker-compose.prod.yml ps

            # Health check
            echo "Checking server health..."
            for i in 1 2 3 4 5; do
              if docker exec airbnb-server wget -qO- http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "Server is healthy!"
                break
              fi
              echo "Attempt $i: waiting..."
              sleep 5
            done

            # Cleanup old images
            docker image prune -f --filter "until=168h"
